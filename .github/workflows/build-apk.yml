name: 编译安卓 APK

# 为什么要有这个：普通用户不该为了装个 App 去装 Android SDK。
# 这里让 GitHub 编译，产物直接下载安装。
on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:        # 允许在网页上手动点「Run workflow」
  release:
    types: [published]

permissions:
  contents: write           # 发布 Release 时需要上传产物

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 跑引擎单测
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: 编译 debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 重命名产物
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             dist/微信自动回复.apk
          ls -lh dist/

      # 每次构建都能在 Actions 页面下载到
      - name: 单测失败时上传报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: 单测报告
          path: android/app/build/reports/tests/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: 微信自动回复-apk
          path: dist/微信自动回复.apk
          retention-days: 90

      # 打了 Release 的话，APK 直接挂到 Release 页面，链接可以直接发给别人
      - name: 附加到 Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/微信自动回复.apk
